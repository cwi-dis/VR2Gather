# CI builds for VR2Gather: build the VRTApp-Develop players, to find build breakage early
# (#355, part of #415), and make releases from them (#417): on a vX.Y.Z or exp-* tag, the
# release job at the end drafts a GitHub release with the players attached.
#
# Modelled on cwipc_unity's .github/workflows/ci.yml (cwi-dis/cwipc_unity#63, #71): game-ci's
# unity-builder with cwipc in the build environment: a Docker image with cwipc added on Linux
# and Windows (.github/docker/*/Dockerfile), cwipc's install-cwipc action on macOS.
# Local builds use VRTApp-Develop/scripts/build.sh instead; why the CI doesn't:
# https://github.com/cwi-dis/VR2Gather/issues/415#issuecomment-7064351465
#
# Two development projects, one per render pipeline (#429, part of #256): VRTApp-Develop (BIRP,
# without the URP package) is built for every platform; VRTApp-Develop-URP only on Linux, the
# cheapest job.
#
# The package's tests (nl.cwi.dis.vr2gather/Tests, #416) run in the Linux job, in both projects:
# EditMode and PlayMode, with game-ci's unity-test-runner in the same cwipc image, as in
# cwipc_unity (cwi-dis/cwipc_unity#63).
#
# Secrets (same as cwipc_unity, Unity Personal): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.

name: CI

# On pushes to master and on pull requests, not on every branch: a feature branch gets CI by
# opening a pull request for it, or by starting the workflow by hand (Actions → CI → Run workflow).
# Tags: vX.Y.Z makes a draft release, exp-* (an experiment or test build, also on a branch) a
# draft pre-release (#417).
on:
  push:
    branches: [master]
    tags: ['v*', 'exp-*']
  pull_request:
  workflow_dispatch:
    inputs:
      cwipc-version:
        description: 'cwipc version to build against: a release tag, or master'
        required: false
        default: 'v8.3.0'

jobs:
  # Cheap checks without Unity, on every run (#431). A player build doesn't catch these: pink
  # materials build fine, and a shader error in a SubShader that isn't used doesn't fail it.
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Every URP SubShader must have PackageRequirements, or projects without URP get
      # shader compile errors (#365). Copied from cwipc_unity.
      - name: URP SubShaders can be skipped without URP
        run: python3 .github/scripts/check_urp_subshaders.py nl.cwi.dis.vr2gather
      # Every material in the package must work in both BIRP and URP (#433): no Standard,
      # no Unity Default-Material, no URP-only shaders.
      - name: Materials work in both render pipelines
        run: python3 .github/scripts/check_render_pipeline_materials.py nl.cwi.dis.vr2gather
      # A release tag must match package.json and have a changelog section (#417): fails here, in
      # the first minute, instead of in the release job after the player builds.
      - name: Release tag matches package.json and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" --check

  # Linux: game-ci runs Unity in a Docker container; cwipc comes in through a custom image,
  # game-ci's image plus cwipc's -built- archive. A desktop player without XR (OpenXR doesn't
  # support Linux, #366), through VRT.Tools.CommandLineBuild.BuildWithoutXR, then the tests (#416).
  build-linux:
    name: Build and test (Linux, ${{ matrix.pipeline }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline: BIRP
            project: VRTApp-Develop
            artifact: VR2Gather-linux-x64
          - pipeline: URP
            project: VRTApp-Develop-URP
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      # Restore and save as separate steps: actions/cache saves only when the whole job succeeds,
      # so a job that kept failing (BIRP tests, #416) never got a Library cache at all. Library2:
      # the Library-Linux-* caches of run 45366368426 were saved right after the build, a state
      # the test containers reinstall packages over (see the warm-up step).
      - id: library-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.project }}/Library
          key: Library2-Linux-${{ matrix.pipeline }}-${{ hashFiles(format('{0}/Packages/**', matrix.project), format('{0}/ProjectSettings/**', matrix.project), 'nl.cwi.dis.vr2gather/package.json') }}
          restore-keys: |
            Library2-Linux-${{ matrix.pipeline }}-

      - id: unity
        name: Unity version of the project
        run: |
          echo "version=$(sed -n 's/^m_EditorVersion: //p' ${{ matrix.project }}/ProjectSettings/ProjectVersion.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the image with cwipc
        run: |
          docker build \
            --build-arg UNITY_VERSION=${{ steps.unity.outputs.version }} \
            --build-arg CWIPC_VERSION=${{ inputs.cwipc-version == 'master' && 'nightly' || inputs.cwipc-version || 'v8.3.0' }} \
            -t vr2gather-ci:linux .github/docker/linux

      # Pinned to an exact version, as in cwipc_unity: @v5 may move to the CLI-based builder.
      # versioning None: the default (Semantic) wants the full git history, which this repo
      # doesn't need for a CI build.
      - name: Build player
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ matrix.project }}
          targetPlatform: StandaloneLinux64
          unityVersion: auto
          customImage: vr2gather-ci:linux
          buildMethod: VRT.Tools.CommandLineBuild.BuildWithoutXR
          buildName: VR2Gather
          buildsPath: Builds
          versioning: None

      # No artifact for URP yet: VRTApp-Develop (BIRP) is the released player; the URP build only
      # checks that the URP project compiles and builds. Zipped as build.sh does (the release
      # attaches the zip as it is, #417): the folder's contents, without the debug symbols.
      - name: Zip
        if: matrix.pipeline == 'BIRP'
        run: |
          cd Builds/StandaloneLinux64
          zip -qry "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" . -x '*DoNotShip*' '*DontShip*'

      - uses: actions/upload-artifact@v7
        if: matrix.pipeline == 'BIRP'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      # EditMode and PlayMode tests, after the build, as two steps: with testMode all, game-ci's
      # CLI starts the two Unity processes overlapping on the same project, and one of them then
      # finds files in Library/PackageCache changed or missing (#416; runs 45262169056 and
      # 45270025200). With the tests before the build, the URP build once failed the same way.
      # Also when the build failed. continue-on-error: the summaries below fail the job, not
      # game-ci's verdict, which can be success without any test having run (seen in cwipc_unity).
      # Throwaway warm-up (#416): in the first test container after a build, Unity's Package Manager
      # reinstalls packages in Library/PackageCache while the scripts are already compiling, so that
      # run fails on missing files ("Modification date ... changed while running Csc", run
      # 45366368426). The second container finds a stable PackageCache. Why the Package Manager
      # reinstalls is unknown (same /root mount, same 65 packages). Not only with an empty Library
      # cache: also after an exact cache hit (run 45385059326, BIRP), so on every run. A filter
      # that matches no test.
      - name: Warm up the test container
        if: success() || failure()
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: ${{ matrix.project }}
          testMode: editmode
          customParameters: -testFilter NoTestHasThisName
          customImage: vr2gather-ci:linux
          cliVersion: v0.1.76
          artifactsPath: test-results-warmup
          # No check run for the warm-up.
          githubToken: ''

      - name: Run EditMode tests
        if: success() || failure()
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # game-ci reads the token for its GitHub API calls from the environment, not from
          # its githubToken input; anonymous calls hit the shared per-IP rate limit (403).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: ${{ matrix.project }}
          testMode: editmode
          customImage: vr2gather-ci:linux
          # Pinned, as in cwipc_unity: no "latest" lookup, reproducible runs. Update deliberately.
          cliVersion: v0.1.76
          artifactsPath: test-results
          checkName: EditMode tests (Linux, ${{ matrix.pipeline }})

      - name: Run PlayMode tests
        if: success() || failure()
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # game-ci reads the token for its GitHub API calls from the environment, not from
          # its githubToken input; anonymous calls hit the shared per-IP rate limit (403).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: ${{ matrix.project }}
          testMode: playmode
          customImage: vr2gather-ci:linux
          # Pinned, as in cwipc_unity: no "latest" lookup, reproducible runs. Update deliberately.
          cliVersion: v0.1.76
          artifactsPath: test-results
          checkName: PlayMode tests (Linux, ${{ matrix.pipeline }})

      # Saved after the tests rather than after the build: the state the test containers settled on.
      # A key that exists already is never overwritten, so only when the restore wasn't an exact hit.
      - uses: actions/cache/save@v6
        if: (success() || failure()) && steps.library-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ matrix.project }}/Library
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

      - id: test-artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-linux-${{ matrix.pipeline }}
          path: test-results/
          if-no-files-found: warn

      # Our own summaries (.github/scripts/test_summary.py, from cwipc_unity): they fail the job
      # when a results file is missing, no test ran, or a test failed.
      - name: EditMode test summary
        if: always()
        run: >
          python3 .github/scripts/test_summary.py
          --label "EditMode tests (Linux, ${{ matrix.pipeline }})"
          --artifact-url "${{ steps.test-artifact.outputs.artifact-url }}"
          --log-hint "More in the check **EditMode tests (Linux, ${{ matrix.pipeline }})** (game-ci's test report), and in the job log, step **Run EditMode tests**."
          test-results/editmode-results.xml

      - name: PlayMode test summary
        if: always()
        run: >
          python3 .github/scripts/test_summary.py
          --label "PlayMode tests (Linux, ${{ matrix.pipeline }})"
          --artifact-url "${{ steps.test-artifact.outputs.artifact-url }}"
          --log-hint "More in the check **PlayMode tests (Linux, ${{ matrix.pipeline }})** (game-ci's test report), and in the job log, step **Run PlayMode tests**."
          test-results/playmode-results.xml

  # Windows: as Linux, with .github/docker/windows/Dockerfile. game-ci's Windows images are
  # Windows Server 2022, so this needs a windows-2022 runner. Player with XR (game-ci's own
  # build method).
  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/cache@v6
        with:
          path: VRTApp-Develop/Library
          key: Library-Windows-${{ hashFiles('VRTApp-Develop/Packages/**', 'VRTApp-Develop/ProjectSettings/**', 'nl.cwi.dis.vr2gather/package.json') }}
          restore-keys: |
            Library-Windows-

      - id: unity
        name: Unity version of the project
        shell: bash
        run: |
          echo "version=$(sed -n 's/^m_EditorVersion: //p' VRTApp-Develop/ProjectSettings/ProjectVersion.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Build the image with cwipc
        shell: bash
        run: |
          docker build \
            --build-arg UNITY_VERSION=${{ steps.unity.outputs.version }} \
            --build-arg CWIPC_VERSION=${{ inputs.cwipc-version == 'master' && 'nightly' || inputs.cwipc-version || 'v8.3.0' }} \
            -t vr2gather-ci:windows .github/docker/windows

      - name: Build player
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: VRTApp-Develop
          targetPlatform: StandaloneWindows64
          unityVersion: auto
          customImage: vr2gather-ci:windows
          buildName: VR2Gather
          buildsPath: Builds
          versioning: None

      # Zipped as build.sh does on Windows (#417): the folder's contents, without the debug symbols.
      - name: Zip
        shell: pwsh
        run: |
          Get-ChildItem Builds/StandaloneWindows64 |
            Where-Object { $_.Name -notlike '*DoNotShip*' -and $_.Name -notlike '*DontShip*' } |
            Compress-Archive -DestinationPath VR2Gather-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: VR2Gather-windows-x64
          path: VR2Gather-windows-x64.zip
          if-no-files-found: error

  # macOS: Unity runs directly on the runner; cwipc from cwipc's install-cwipc action.
  # arm64 on every run (unlike cwipc_unity: runner scarcity hasn't been a problem, #355); Intel
  # only on master and when started by hand (#431), for as long as we still have Intel Macs in use.
  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Intel takes about 40 minutes (no Editor cache, game-ci/unity-builder#869): only on
        # master, or when the workflow is started by hand (#431). arm64 on every run.
        include: >-
          ${{ fromJSON((github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && '[{"arch": "arm64", "runner": "macos-15", "hub-arch": "arm64", "hub-sha256": "e04d0320daf5df3d460435320222d8f4981f1388ecb0b5b22482ad98a9bbbf85"}, {"arch": "intel", "runner": "macos-15-intel", "hub-arch": "x64", "hub-sha256": "ec2b1cea97ba8c418cd87c9e216294224ac7cee393fa84c6d6b1d98d1f963b92"}]' || '[{"arch": "arm64", "runner": "macos-15", "hub-arch": "arm64", "hub-sha256": "e04d0320daf5df3d460435320222d8f4981f1388ecb0b5b22482ad98a9bbbf85"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/cache@v6
        with:
          path: VRTApp-Develop/Library
          key: Library-macOS-${{ matrix.arch }}-${{ hashFiles('VRTApp-Develop/Packages/**', 'VRTApp-Develop/ProjectSettings/**', 'nl.cwi.dis.vr2gather/package.json') }}
          restore-keys: |
            Library-macOS-${{ matrix.arch }}-

      - id: cwipc
        uses: cwi-dis/cwipc/.github/actions/install-cwipc@v8.3.0
        with:
          version: ${{ inputs.cwipc-version || 'v8.3.0' }}

      # Temporary workaround, copied from cwipc_unity: Unity Hub 3.22.6 instead of brew's latest.
      # Hub 4.x no longer supports the headless install unity-builder v5.0.1 uses, and the
      # builder skips its own Hub install when /Applications/Unity Hub.app exists.
      # URL and sha256 from the Homebrew cask for 3.22.6.
      - name: Unity Hub 3.22.6
        run: |
          v=3.22.6
          dmg="$RUNNER_TEMP/UnityHubSetup.dmg"
          curl -fsSL -o "$dmg" "https://public-cdn.cloud.unity3d.com/hub/prod/$v/UnityHubSetup-$v-${{ matrix.hub-arch }}.dmg"
          echo "${{ matrix.hub-sha256 }}  $dmg" | shasum -a 256 -c -
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's/.*\(\/Volumes\/.*\)$/\1/p' | tail -1)
          cp -R "$mnt/Unity Hub.app" /Applications/
          hdiutil detach "$mnt"

      - name: Build player
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: VRTApp-Develop
          targetPlatform: StandaloneOSX
          unityVersion: auto
          # Keep the installed Editor in the Actions cache: installing it takes ~14 minutes (#355).
          # arm64 only: game-ci's cache key has no architecture, so the Intel job would restore
          # the arm64 Editor ("Bad CPU type"; game-ci/unity-builder#869), and a second 5.5 GB
          # Editor doesn't fit the cache.
          cacheUnityInstallationOnMac: ${{ matrix.arch == 'arm64' }}
          buildName: VR2Gather
          buildsPath: Builds
          versioning: None

      # Zipped here: upload-artifact doesn't keep the symlinks in an .app bundle. The player is
      # universal (x86_64 and arm64) whichever runner builds it, so only the arm64 job's goes out;
      # the Intel job is a build check (#417). Not all of it runs on Intel: the ffmpeg libraries
      # of the native libraries package are arm64 only (Dash).
      - name: Zip
        if: matrix.arch == 'arm64'
        run: |
          cd Builds/StandaloneOSX
          zip -qry "$GITHUB_WORKSPACE/VR2Gather-macos-universal.zip" . -x '*DoNotShip*' '*DontShip*' '*.DS_Store'

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'arm64'
        with:
          name: VR2Gather-macos-universal
          path: VR2Gather-macos-universal.zip
          if-no-files-found: error

  # Android (standalone Meta Quest): game-ci's own Android image, nothing to install: cwipc's
  # Android libraries come with cwipc_unity (nl.cwi.dis.cwipc/Runtime/Plugins/android-arm64).
  # Built with the Meta Quest build profile, which overrides Player and Quality settings.
  # Signed with Unity's debug key: fine for sideloading.
  build-android:
    name: Build (Android, Meta Quest)
    runs-on: ubuntu-24.04
    steps:
      # No "free disk space" step needed: the ubuntu-24.04 runner had 89 GB free (#355).
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/cache@v6
        with:
          path: VRTApp-Develop/Library
          key: Library-Android-${{ hashFiles('VRTApp-Develop/Packages/**', 'VRTApp-Develop/ProjectSettings/**', 'nl.cwi.dis.vr2gather/package.json') }}
          restore-keys: |
            Library-Android-

      - name: Build player
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: VRTApp-Develop
          targetPlatform: Android
          buildProfile: Assets/Settings/Build Profiles/Meta Quest.asset
          unityVersion: auto
          buildName: VR2Gather
          buildsPath: Builds
          versioning: None

      # Under its release name (#417); exactly one .apk expected.
      - name: Rename
        run: |
          apks=(Builds/Android/*.apk)
          [ ${#apks[@]} = 1 ] && [ -f "${apks[0]}" ] || { echo "Expected one .apk in Builds/Android: ${apks[*]}"; exit 1; }
          cp "${apks[0]}" VR2Gather-quest-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: VR2Gather-quest-arm64
          path: VR2Gather-quest-arm64.apk
          if-no-files-found: error

  # Release (#417), on a vX.Y.Z or exp-* tag only, when everything built and the tests passed:
  # a draft GitHub release for the tag (a pre-release for exp-*), with the release notes from
  # CHANGELOG.md (.github/scripts/release_notes.py) and the players attached. Publishing stays
  # by hand, after the players have been run (Documentation/21-releasing.md). Run again, it
  # updates the draft; a published release is left alone.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: VR2Gather-*
          path: players
          merge-multiple: true

      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Draft release with the players
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          ls -l players
          for f in VR2Gather-windows-x64.zip VR2Gather-linux-x64.zip VR2Gather-macos-universal.zip VR2Gather-quest-arm64.apk; do
            [ -f "players/$f" ] || { echo "Missing player: $f"; exit 1; }
          done
          # From the list, not gh release view: looking up by tag doesn't always find drafts.
          draft=$(gh release list --limit 100 --json tagName,isDraft --jq ".[] | select(.tagName == \"$tag\") | .isDraft")
          if [ "$draft" = false ]; then
            echo "Release $tag is already published: not changing it"; exit 1
          elif [ "$draft" = true ]; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            prerelease=()
            case "$tag" in exp-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" --draft "${prerelease[@]}" --verify-tag --title "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" players/* --clobber
